# Daily maintenance of nioxxer.com (ARCHITECTURE § 8): scripts/maintenance.ts with firebase-admin
# and the Cloudinary Admin API. Secrets (GitHub › Settings › Secrets › Actions, never in the repo):
# FIREBASE_SERVICE_ACCOUNT, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET.
# A failed step makes the job fail: GitHub then e-mails the repository owner.
name: Maintenance

on:
  schedule:
    - cron: '0 2 * * *' # 03:00 in Douala
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Analyser seulement (ne rien effacer)'
        type: boolean
        default: true
      orphans:
        description: 'Chercher aussi les likes, signalements et photos orphelins (sinon : le dimanche)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned by commit (a moved tag cannot run other code with the secrets), no token left on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Maintenance
        run: npx tsx scripts/maintenance.ts $DRY_RUN $ORPHANS
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          ORPHANS: ${{ inputs.orphans && '--orphans' || '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
