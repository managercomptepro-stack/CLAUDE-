# Production deploy of nioxxer.com (project nioxxer-staging since the owner's choice A, 4 Oct 2026):
# npm run deploy, then HTTP checks on nioxxer.com. Runs when .github/deploy-trigger changes.
# The v1 export (nioxxer-cda95: 2 accounts, 0 listing) was done in run 37211871765.
name: Production

on:
  push:
    branches: [claude/jolly-ptolemy-nystbu]
    paths: [.github/deploy-trigger]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Service account key (runner temp only)
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json" && echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy (legal check + tests + hosting + rules + indexes)
        run: npm run deploy -- --non-interactive
      - name: Check nioxxer.com
        run: |
          fail=0
          for u in $(curl -fsS https://nioxxer.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//'); do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$u"); echo "$c $u"; [ "$c" = 200 ] || fail=1
          done
          for p in /connexion /publier /compte /admin; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://nioxxer.com$p"); echo "$c $p"; [ "$c" = 200 ] || fail=1
          done
          echo "404 attendu: $(curl -s -o /dev/null -w '%{http_code}' https://nioxxer.com/n-existe-pas)"
          curl -sI https://nioxxer.com/ | grep -i -E 'cache-control|content-security'
          exit $fail
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
