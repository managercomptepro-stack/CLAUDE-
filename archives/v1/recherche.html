<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#100E14">
<link rel="canonical" href="https://nioxxer.com/recherche">
<title>Recherche · NIOXXER</title>
<meta name="description" content="Filtrez les annonces de rencontre par ville, quartier, genre et âge partout au Cameroun.">
<meta property="og:title" content="Recherche · NIOXXER">
<meta property="og:description" content="Filtrez les annonces de rencontre par ville, quartier, genre et âge partout au Cameroun.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nioxxer.com/recherche">
<meta property="og:image" content="https://nioxxer.com/og-image.png">
<meta property="og:locale" content="fr_CM">
<meta property="og:site_name" content="NIOXXER">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<style>
body{background:transparent;color:var(--ink);font-family:var(--font-ui);font-size:var(--t-body);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.page{max-width:var(--page-max);margin:0 auto;position:relative;z-index:2}
@keyframes mm2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-11vw,7vw) scale(1.1)}}
.spark{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.85) 26%,rgba(255,255,255,0) 70%)}
@keyframes fly{0%{transform:translate3d(0,10vh,0)}50%{transform:translate3d(calc(var(--dx,4vw)*.55),-28vh,0)}
  100%{transform:translate3d(var(--dx,4vw),-66vh,0)}}
@keyframes twinkle{0%,100%{opacity:0}10%{opacity:var(--o,.9)}40%{opacity:calc(var(--o,.9)*.28)}
  62%{opacity:var(--o,.9)}88%{opacity:calc(var(--o,.9)*.45)}}
.ready [data-rise]{opacity:1;transform:none;
  transition:opacity var(--t-slow) var(--ease),transform var(--t-slow) var(--ease);transition-delay:var(--d,0ms)}
.masthead{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:11px var(--gutter);background:var(--bar);
  -webkit-backdrop-filter:blur(20px) saturate(1.35);backdrop-filter:blur(20px) saturate(1.35);
  border-bottom:1px solid transparent;transition:background var(--t-mid),border-color var(--t-mid)}
.masthead.condensed{background:var(--bar-solid);border-bottom-color:var(--line)}
.mark{font-family:var(--font-display);font-size:19px;color:var(--accent)}
.stamp{font-size:8.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;padding:3px 7px;border-radius:var(--r-pill)}
.stamp.premium{background:linear-gradient(96deg,var(--saffron),var(--saffron-lift));color:var(--saffron-ink)}
.sheet{position:fixed;inset:0;z-index:70;display:none;background:rgba(var(--veil-rgb),.68);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);align-items:flex-end}
.sheet .panel{width:100%;max-width:var(--page-max);margin:0 auto;background:var(--bg-lift);
  border-radius:var(--r-panel) var(--r-panel) 0 0;border-top:1px solid var(--line);
  padding:var(--sp-2) 14px calc(var(--sp-5) + env(safe-area-inset-bottom));animation:up .26s var(--ease)}
.grip{width:34px;height:3.5px;border-radius:var(--r-pill);background:rgba(255,255,255,.22);margin:0 auto var(--sp-3)}
.sheet h3{font-family:var(--font-display);font-size:17px;font-weight:400;margin:0 4px 6px}
.opts{display:flex;flex-direction:column;gap:5px;max-height:44vh;overflow-y:auto;overscroll-behavior:contain}
.opt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r-field);
  background:var(--panel);border:1px solid transparent;color:var(--ink);font-size:14px;text-align:left}
.sheet-search{width:100%;margin-bottom:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-field);padding:11px 13px;color:var(--ink);font-family:var(--font-ui);font-size:14px;outline:none}
.tabs .row{position:relative;max-width:var(--page-max);margin:0 auto;display:grid;
  grid-template-columns:repeat(4,1fr);align-items:end;padding:7px 8px 8px}
.glide{position:absolute;top:3px;height:2.5px;width:24px;border-radius:var(--r-pill);
  background:var(--accent);transition:left var(--t-mid) var(--ease)}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--ink-40)}
.slot svg{width:20px;height:20px;fill:currentColor}
.slot.post .knob{width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;
  align-items:center;justify-content:center;margin-top:-13px;box-shadow:0 6px 15px -5px rgba(var(--accent-rgb),.7)}
.slot.post .knob svg{width:21px;height:21px;fill:var(--accent-ink)}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.post-link{display:block;text-align:center;margin-top:8px;padding:11px 0;border-radius:var(--r-pill);
  border:1.5px solid rgba(var(--accent-rgb),.55);color:var(--accent);font-size:13.5px;font-weight:700;text-decoration:none}
.reset{margin-left:auto;font-size:12.5px;color:var(--accent)}
.search{padding:var(--sp-3) var(--gutter) 0;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-field);
  padding:13px 14px 13px 42px;color:var(--ink);font-family:var(--font-ui);font-size:14.5px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:calc(var(--gutter) + 14px);top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--ink-40);fill:none}
.blk{padding:var(--sp-6) var(--gutter) 0}
.lbl{display:flex;align-items:center;font-size:var(--t-micro);font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--saffron)}
.lbl .val{margin-left:auto;font-size:12.5px;color:var(--ink-60);letter-spacing:0;text-transform:none;font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:var(--sp-3)}
.chip{font-size:13px;font-weight:600;padding:9px 14px;border-radius:var(--r-pill);background:var(--panel);
  color:var(--ink-60);border:1px solid var(--line);transition:all var(--t-fast)}
.chip[aria-pressed="true"]{background:rgba(var(--accent-rgb),.14);border-color:var(--accent);color:var(--accent)}
.picker-btn{width:100%;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-field);padding:13px 14px;font-size:14.5px;color:var(--ink);text-align:left;margin-top:var(--sp-3)}
.range{position:relative;height:44px;margin-top:6px}
.range .bar{position:absolute;top:20px;left:0;right:0;height:4px;border-radius:var(--r-pill);background:rgba(255,255,255,.12)}
.range .fill{position:absolute;top:20px;height:4px;border-radius:var(--r-pill);background:var(--accent)}
.range input{position:absolute;top:11px;left:0;width:100%;height:22px;margin:0;-webkit-appearance:none;
  background:none;pointer-events:none}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;
  border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.range input::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;
  background:var(--accent);border:3px solid var(--bg)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-40);margin-top:-4px}
.row{display:flex;align-items:center;gap:12px;margin-top:9px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-card);padding:13px 14px}
.row .txt{flex:1}
.row .t1{font-size:14px;font-weight:600}
.row .t2{font-size:11.5px;color:var(--ink-40);margin-top:3px;line-height:1.45}
.sw{width:46px;height:27px;border-radius:var(--r-pill);background:rgba(255,255,255,.12);position:relative;flex:0 0 auto}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--ink-40);transition:.2s var(--ease)}
.sw.on{background:var(--accent)}
.sw.on i{left:22px;background:var(--accent-ink)}
.sorts{display:flex;flex-direction:column;gap:7px;margin-top:var(--sp-3)}
.sort{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-card);padding:13px 14px;text-align:left}
.sort[aria-selected="true"]{border-color:var(--accent);background:rgba(var(--accent-rgb),.1)}
.radio{width:19px;height:19px;border-radius:50%;border:1.5px solid rgba(var(--accent-rgb),.45);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center}
.sort[aria-selected="true"] .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.sort .st{font-size:14px;font-weight:600}
.sort .sd{font-size:11.5px;color:var(--ink-40);margin-top:2px}
.info{margin:var(--sp-6) var(--gutter) 0;background:rgba(var(--saffron-rgb),.08);border-left:3px solid var(--saffron);
  border-radius:0 12px 12px 0;padding:12px 13px;font-size:12.5px;line-height:1.6;color:var(--ink-60)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:var(--sp-3) var(--gutter) calc(var(--sp-3) + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(var(--bg-rgb),.98) 62%,rgba(var(--bg-rgb),0))}
.cta{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-pill);
  padding:15px 0;font-family:var(--font-display);font-size:16px}
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true">
  <i class="mass m1"></i><i class="mass m2"></i><i class="mass m3"></i>
</div>
<div class="page">

<header class="masthead" id="masthead">
  <button class="icon-btn" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.4-1.4L9.8 12l7.1-6.6L15.5 4Z"/></svg></button>
  <h1>Recherche</h1>
  <button class="reset" id="reset">Réinitialiser</button>
</header>

<div class="search" data-rise style="--d:0ms">
  <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
  <input type="search" id="q" maxlength="60" placeholder="Un mot dans l'annonce…" enterkeyhint="search">
</div>

<div class="blk" data-rise style="--d:50ms">
  <div class="lbl">Je cherche</div>
  <div class="chips" id="genres">
    <button class="chip" aria-pressed="true">Tout</button>
    <button class="chip" aria-pressed="false">Femme</button>
    <button class="chip" aria-pressed="false">Homme</button>
    <button class="chip" aria-pressed="false">Gay</button>
    <button class="chip" aria-pressed="false">Lesbienne</button>
    <button class="chip" aria-pressed="false">Trans</button>
    <button class="chip" aria-pressed="false">Couples</button>
    <button class="chip" aria-pressed="false">Autres</button>
  </div>
</div>

<div class="blk">
  <div class="lbl">Ville</div>
  <button class="picker-btn" id="cityBtn">
    <svg width="13" height="13" viewBox="0 0 24 24" style="fill:var(--saffron)"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
    <span id="cityLabel">Douala</span><span class="caret">▾</span>
  </button>
</div>

<div class="blk">
  <div class="lbl">Quartiers <span class="val" id="qVal">Tous</span></div>
  <div class="chips" id="quartiers"></div>
</div>

<div class="blk">
  <div class="lbl">Âge <span class="val" id="ageVal">18 – 70+ ans</span></div>
  <div class="range">
    <div class="bar"></div><div class="fill" id="fill"></div>
    <input type="range" id="amin" min="18" max="70" value="18" aria-label="Âge minimum">
    <input type="range" id="amax" min="18" max="70" value="70" aria-label="Âge maximum">
  </div>
  <div class="ticks"><span>18</span><span>70+</span></div>
</div>

<!-- Retirés pour la v1 (règle : on ne met en ligne que ce qui fonctionne) :
     « Comptes vérifiés uniquement » (tous les comptes le sont, rule 5),
     « Photos non floutées » (pas de photos tant que l'hébergement n'est pas
     tranché), « Actifs cette semaine » et les tris « Actifs récemment » /
     « Proches de moi » (aucune donnée d'activité ni de distance). À remettre
     avec les données réelles derrière. -->

<div class="info">Les annonces mises en avant portent l'étiquette « Premium » ou « Sponsorisé ». Les sponsorisées sont limitées à trois parmi les dix premiers résultats.</div>

</div>
<div class="dock"><div class="inner"><button class="cta" id="cta">Voir les annonces</button>
  <a class="post-link" href="/publier">+ Publier une annonce, gratuitement</a></div></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<script src="/js/config.js"></script>
<script>

const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(calm) document.documentElement.classList.add('calm');
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const WA=NIOXXER_WA;   /* voir js/config.js — rule 10 */
{
  const host=document.getElementById('scene');
  const kinds=['lozenge','dot','dot','ring'], tints=['rgba(255,255,255,.9)','var(--saffron)','var(--accent)'];
  for(let i=0;i<30;i++){
    const b=document.createElement('span'), s=rnd(4,11);
    b.className='bit '+pick(kinds); b.style.color=pick(tints);
    b.style.width=s+'px'; b.style.height=s+'px'; b.style.left=rnd(-2,101)+'%'; b.style.bottom='0';
    b.style.setProperty('--o',rnd(.22,.52)); b.style.setProperty('--dx',rnd(-10,10)+'vw');
    b.style.setProperty('--rot',rnd(-180,180)+'deg');
    b.style.animation='drift '+rnd(12,24)+'s linear infinite';
    b.style.animationDelay=(-rnd(0,24))+'s'; host.appendChild(b);
  }
  const glows=[['255,255,255',.95],['var(--saffron-rgb)',.85],['var(--accent-rgb)',.75]];
  for(let i=0;i<22;i++){
    const g=document.createElement('span'), c=pick(glows), s=rnd(3,9);
    g.className='spark'; g.style.width=s+'px'; g.style.height=s+'px';
    g.style.left=rnd(-2,101)+'%'; g.style.bottom='0';
    g.style.boxShadow='0 0 '+(s*2.6)+'px '+(s*.55)+'px rgba('+c[0]+','+(c[1]*.55).toFixed(2)+')';
    g.style.setProperty('--o',rnd(.45,1)*c[1]); g.style.setProperty('--dx',rnd(-12,12)+'vw');
    g.style.animation='fly '+rnd(14,26)+'s linear infinite, twinkle '+rnd(2.4,5.2)+'s ease-in-out infinite';
    g.style.animationDelay=(-rnd(0,26))+'s, '+(-rnd(0,5))+'s'; host.appendChild(g);
  }
}
requestAnimationFrame(function(){document.body.classList.add('ready')});
addEventListener('scroll',function(){
  const m=document.getElementById('masthead'); if(m) m.classList.toggle('condensed',scrollY>16);
},{passive:true});
const VILLES=[
    'Douala','Yaoundé','Garoua','Bamenda','Maroua','Bafoussam','Ngaoundéré','Bertoua',
    'Edéa','Loum','Kumba','Nkongsamba','Buea','Kumbo','Foumban','Dschang',
    'Ebolowa','Kousséri','Guider','Mbouda','Limbé','Kribi','Bafang','Tiko',
    'Mbalmayo','Sangmélima','Meiganga','Bafia'
];
const QUARTIERS=NIOXXER_QUARTIERS;   /* voir js/config.js */
let ville='Douala';
function drawQuartiers(){
  const list=QUARTIERS[ville]||[];
  const host=document.getElementById('quartiers');
  host.innerHTML = list.length
    ? list.map(q=>'<button class="chip" data-q aria-pressed="false">'+q+'</button>').join('')
    : '<p style="font-size:12.5px;color:var(--ink-40)">Quartiers non renseignés pour cette ville.</p>';
  host.querySelectorAll('.chip').forEach(function(c){
    c.onclick=function(){
      c.setAttribute('aria-pressed', c.getAttribute('aria-pressed')==='true'?'false':'true');
      qLabel(); count();
    };
  });
  qLabel(); count();
}
function qLabel(){
  const n=document.querySelectorAll('#quartiers .chip[aria-pressed="true"]').length;
  document.getElementById('qVal').textContent = n===0 ? 'Tous' : n+' sélectionné'+(n>1?'s':'');
}
document.querySelectorAll('#genres .chip').forEach(function(c){
  c.onclick=function(){
    document.querySelectorAll('#genres .chip').forEach(x=>x.setAttribute('aria-pressed','false'));
    c.setAttribute('aria-pressed','true'); count();
  };
});
const amin=document.getElementById('amin'), amax=document.getElementById('amax');
const fill=document.getElementById('fill'), ageVal=document.getElementById('ageVal');
function age(e){
  let a=+amin.value, b=+amax.value;
  if(a>b-2){ if(e&&e.target===amin){a=b-2;amin.value=a;} else {b=a+2;amax.value=b;} }
  const L=(a-18)/52*100, R=(b-18)/52*100;
  fill.style.left=L+'%'; fill.style.width=(R-L)+'%';
  ageVal.textContent=a+' – '+(b>=70?'70+':b)+' ans';
  count();
}
amin.oninput=age; amax.oninput=age;

/* CLAUDE.md : ne jamais afficher de chiffre inventé. Le nombre de résultats
   ne sera affiché ici que lorsqu'il viendra d'une vraie requête ; en attendant
   le bouton reste neutre plutôt que d'annoncer une estimation fabriquée. */
function count(){}

/* Le bouton renvoie au fil avec les filtres dans l'URL ; le fil (accueil)
   les lit et les applique. Seuls les filtres réellement choisis sont passés :
   la plage d'âge complète (18 – 70+) n'en est pas un. */
const AGE_MIN=18, AGE_MAX=70, VILLE_DEFAUT='Douala';
const qInput=document.getElementById('q');
function versLeFil(){
  const u=new URLSearchParams();
  if(ville!==VILLE_DEFAUT) u.set('ville',ville);
  const g=document.querySelector('#genres .chip[aria-pressed="true"]');
  if(g && g!==document.querySelector('#genres .chip')) u.set('genre',g.textContent.trim());
  if(+amin.value>AGE_MIN || +amax.value<AGE_MAX){ u.set('amin',amin.value); u.set('amax',amax.value); }
  const q=qInput.value.trim(); if(q) u.set('q',q);
  const qs=[].map.call(document.querySelectorAll('#quartiers .chip[aria-pressed="true"]'),c=>c.textContent.trim());
  if(qs.length) u.set('quartiers',qs.join(','));
  const s=u.toString();
  location.assign('/'+(s?'?'+s:''));
}
document.getElementById('cta').onclick=versLeFil;
qInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); versLeFil(); } });

const sheet=document.getElementById('sheet'), panel=document.getElementById('panel');
function closeSheet(){sheet.classList.remove('open')}
sheet.onclick=function(e){if(e.target===sheet)closeSheet()};
addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
document.getElementById('cityBtn').onclick=function(){
  panel.innerHTML='<div class="grip"></div><h3>Ville</h3>'
    +'<input type="text" class="sheet-search" id="q" placeholder="Chercher une ville…">'
    +'<div class="opts" id="opts"></div>';
  const opts=panel.querySelector('#opts'), q=panel.querySelector('#q');
  function draw(f){
    const list=VILLES.filter(v=>!f||v.toLowerCase().indexOf(f.toLowerCase())>-1);
    opts.innerHTML=list.map(v=>'<button class="opt" role="option" aria-selected="'+(v===ville)+'">'
      +'<span class="rank">'+(VILLES.indexOf(v)+1)+'</span>'+v+'<span class="tick">✓</span></button>').join('');
    opts.querySelectorAll('.opt').forEach(function(b,i){
      b.onclick=function(){ville=list[i];document.getElementById('cityLabel').textContent=ville;
        drawQuartiers();closeSheet();};
    });
  }
  q.oninput=function(){draw(q.value)};
  draw(''); sheet.classList.add('open');
};
document.getElementById('reset').onclick=function(){
  ville=VILLE_DEFAUT; document.getElementById('cityLabel').textContent=ville; drawQuartiers();
  document.querySelectorAll('#genres .chip').forEach((c,i)=>c.setAttribute('aria-pressed',i===0?'true':'false'));
  qInput.value='';
  amin.value=AGE_MIN; amax.value=AGE_MAX; age(); qLabel();
};
drawQuartiers(); age();

</script>
</body>
</html>
